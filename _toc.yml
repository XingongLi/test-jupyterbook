# Table of contents
# Learn more at https://jupyterbook.org/customize/toc.html

format: jb-book
root: index

# chapters:
#   - file: book/markdown
#   - file: book/introduction
#   - file: book/notebooks
#   - file: book/bibliography
# Or you organize the TOC by parts

parts:
  - caption: Preface
    numbered: false
    maxdepth: 2
    chapters:
      - file: book/preface

  - caption: Part One
    numbered: true
    maxdepth: 2
    chapters:
      - file: book/markdown
      - file: book/introduction

  - caption: Part Two
    numbered: true
    maxdepth: 2
    chapters:
      - file: book/notebooks
      
  - caption: Appendices
    chapters:
      - file: book/bibliography
